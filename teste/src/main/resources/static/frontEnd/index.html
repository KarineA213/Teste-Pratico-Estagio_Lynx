
<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estagio.Lynx</title>

    <!--fontes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--styles-->
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/contatos.css">
    <link rel="stylesheet" href="styles/hero.css">
    <link rel="stylesheet" href="styles/products.css">
    <link rel="stylesheet" href="styles/cart.css">






    <!--icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!--scripts-->
    <script src="scripts/scriptHeader.js" defer></script>
   
</head>

<body>
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo"><img src="assets/images/logo.png" alt="Logo da Lynx"></a>
            <button class="hamburguer"></button>

            
            <ul class="nav-list">
                <li><a href="javascript:void(0)" id="cart-icon"><img src="assets/images/carrinho-de-compras.png"></a></li>                <li><a href="#products">Produtos</a></li>
                <li><a href="#footer">Contato</a></li>
                
            </ul>
          
        </nav>

    </header>
    
    <main>
        
        <section class="landingPage">
            <div class="hero-container">
                <div class="hero-content">
                   
                    <h1 class="h1-id">
                        Lynx Spa
                    </h1>
                
                    <h2 class="teste">
                        Teste de Estágio
                    </h2>
                </div>    
            </div>
        </section>


        <section class="products-grid" id="products">
        
            <div class="grid-container">
        
                <div class="product-card">
                    <img class="product-img" src="assets/images/Mouse.jpg" alt="Mouse">
                    <h3>Mouse Gamer</h3>
                    <p>R$ 50,00</p>
                    <button class="add-button">
                        Adicionar ao carrinho
                        <img src="assets/images/carrinho-de-compras.png">
                    </button>
                </div>
        
                <div class="product-card">
                    <img class="product-img" src="assets/images/Teclado.jpg" alt="Teclado">
                    <h3>Teclado Mecânico</h3>
                    <p>R$ 120,00</p>
                    <button class="add-button">
                        Adicionar ao carrinho
                        <img src="assets/images/carrinho-de-compras.png">
                    </button>
                </div>
        
                <div class="product-card">
                    <img class="product-img" src="assets/images/Monitor.jpg" alt="Monitor">
                    <h3>Monitor 24"</h3>
                    <p>R$ 900,00</p>
                    <button class="add-button">
                        Adicionar ao carrinho
                        <img src="assets/images/carrinho-de-compras.png">
                    </button>
                </div>       
            </div> 
        </section>



        
    </main>

    <!-- cart side bar-->

    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Carrinho</h2>
            <button id="close-cart" class="close-cart">&times;</button>
        </div>
        <div id="cart-items-list" class="cart-items-list">
            <p class="empty-cart">Seu carrinho está vazio.</p>
        </div>
        <div class="cart-footer">
            <p id="total-price-display" class="total-price">Total: R$ 0,00</p>
            <button class="checkout-button">Finalizar Compra</button>
        </div>
    </div>

    <div id="cart-overlay" class="cart-overlay"></div>

    <footer>
        <div class="bottom-bar">
            <p>&copy; Lynx Brasil All rights reserved</p>
        </div>
    </footer>

    <script src="scripts/scriptHeader.js"></script>
    <script src="scripts/scriptProducts"></script> 
    
</body>
</html>
